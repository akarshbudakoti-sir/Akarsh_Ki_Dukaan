<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#09090d"><title>Admin · Akarsh Ki Dukaan</title><link rel="stylesheet" href="style.css"></head>
<body><header class="topbar"><a class="brand" href="./"><span class="brand-mark">A</span><span>Akarsh <b>Ki Dukaan</b></span></a><a class="admin-link" href="./">View store</a></header>
<main class="wrap admin-wrap"><section class="intro"><p class="eyebrow">STORE MANAGEMENT</p><h1>Admin<span>.</span></h1><p>Sign in to manage app listings.</p></section>
<div id="adminStatus" class="status">Loading…</div>
<section id="loginPanel" class="panel"><h2>Admin login</h2><form id="loginForm"><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">Sign in</button></form></section>
<section id="manager" class="hidden">
<div class="panel"><div class="section-head"><h2 id="formTitle">Add an app</h2><button id="logout" class="secondary" type="button">Sign out</button></div>
<form id="appForm"><input id="appId" type="hidden"><label>App name<input id="name" required maxlength="100" placeholder="AI Video Generator"></label>
<div class="form-row"><label>Category<input id="category" value="Mods" required placeholder="Mods, Tools, Games"></label><label>Version<input id="version" placeholder="Unknown"></label></div>
<div class="form-row"><label>File size<input id="size" placeholder="27.1 MB"></label><label>Icon URL (optional)<input id="iconUrl" type="url" placeholder="https://..."></label></div>
<label>Description<textarea id="description" rows="3" placeholder="What does this app do?"></textarea></label>
<label>Download URL<input id="downloadUrl" type="url" required placeholder="https://..."></label>
<div class="form-row"><button class="primary" type="submit">Save app</button><button class="secondary" id="cancelEdit" type="button">Clear form</button></div></form></div>
<div class="section-head"><h2>Current listings</h2><span id="adminCount"></span></div><div id="adminApps" class="admin-list"></div></section>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="admin.js"></script></body></html>
