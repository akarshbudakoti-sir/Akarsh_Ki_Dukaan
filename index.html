<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Akarsh Ki Dukaan</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <h1>Akarsh Ki Dukaan</h1>
  <input type="text" id="searchInput" placeholder="Search apps...">
</header>

<nav class="categories" id="categoryBar"></nav>

<main class="appGrid" id="appGrid"></main>

<div class="modalOverlay" id="modalOverlay">
  <div class="modalBox">
    <button id="closeModal" class="closeBtn">&times;</button>
    <div class="modalHeader">
      <span id="modalIcon" class="modalIcon"></span>
      <div>
        <h2 id="modalName"></h2>
        <p id="modalCategory" class="modalCategory"></p>
      </div>
    </div>
    <p id="modalDesc" class="modalDesc"></p>
    <p class="modalMeta">Version: <span id="modalVersion"></span> &middot; Size: <span id="modalSize"></span></p>
    <a id="modalDownload" class="downloadBtn" href="#">Download APK</a>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
