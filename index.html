<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000"><title>Akarsh ModStore</title><link rel="stylesheet" href="style.css"><style>
.refresh-link{width:42px;height:42px;min-width:42px;display:inline-flex;align-items:center;justify-content:center;border:1px solid #444;border-radius:50%;background:#080808;color:#fff;text-decoration:none;flex-shrink:0}
.refresh-link svg{width:19px;height:19px;display:block}
.refresh-link:focus-visible{outline:2px solid #aaa;outline-offset:3px}
.topbar-actions{display:flex;align-items:center;gap:10px;flex-shrink:0}
@media(max-width:520px){.brand{min-width:0}.brand span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.topbar-actions{gap:8px}}
.chip-hidden{display:none!important}.chip-more{white-space:nowrap}.categories-expanded .chip-more{display:none}

html,body{background:transparent!important}
body{position:relative;isolation:isolate;color:#f5f5f7}
body::before{content:"";position:fixed;inset:0;z-index:-2;background-image:var(--store-wallpaper-url, #000);background-size:cover;background-position:center center;background-repeat:no-repeat}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:rgba(3,4,12,.12)}
.topbar{background:rgba(4,4,10,.62)!important;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.wrap{background:transparent!important}
.search,.status,.chip,.app-card,.card,.app,.admin-card,.panel,.form-card,.listing,.admin-section,.admin-works,.auth-card,.section-card{background-color:rgba(8,8,16,.76)!important;backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
.chip.selected,.chip[aria-pressed="true"]{background:#f5f5f5!important;color:#111!important}
footer{background:rgba(4,4,10,.58)!important;backdrop-filter:blur(8px)}


/* App details screen */
.app-card{cursor:pointer;transition:transform .16s ease,border-color .16s ease}
.app-card:hover{border-color:#666;transform:translateY(-2px)}
.app-card .download{display:none!important}
.app-details-screen{position:fixed;inset:0;z-index:1000;overflow-y:auto;background:#000;color:#f5f5f5;padding:0 0 32px}
.app-details-top{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:12px;padding:14px 16px;background:rgba(0,0,0,.94);border-bottom:1px solid #222;backdrop-filter:blur(16px)}
.app-details-back{border:1px solid #383838;background:#101010;color:#fff;border-radius:999px;padding:8px 13px;font:inherit}
.app-details-content{width:min(100% - 28px,720px);margin:20px auto 0}
.app-details-hero{display:flex;gap:16px;align-items:center;padding:18px;border:1px solid #242424;border-radius:20px;background:#090909}
.app-details-icon{width:88px;height:88px;flex:0 0 88px;border-radius:20px;overflow:hidden;display:grid;place-items:center;background:#222;font-size:25px;font-weight:800}
.app-details-icon img{width:100%;height:100%;object-fit:cover}
.app-details-hero h1{font-size:clamp(22px,5vw,30px);line-height:1.15;margin:0 0 6px;overflow-wrap:anywhere}
.app-details-sub{color:#aaa;font-size:13px}
.app-details-stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.app-details-stat{border:1px solid #303030;background:#111;border-radius:999px;padding:5px 10px;color:#ddd;font-size:12px}
.app-details-section{margin-top:16px;padding:18px;border:1px solid #242424;border-radius:18px;background:#090909}
.app-details-section h2{font-size:17px;margin:0 0 9px}
.app-details-section p{margin:0;color:#c5c5c5;white-space:pre-wrap;overflow-wrap:anywhere}
.app-details-download{display:block;width:100%;margin-top:18px;padding:15px;border:0;border-radius:14px;background:#fff;color:#000;text-align:center;font-weight:800;font-size:16px}
@media(max-width:420px){.app-details-hero{align-items:flex-start;padding:14px;gap:12px}.app-details-icon{width:72px;height:72px;flex-basis:72px;border-radius:16px}}
</style></head><body><header class="topbar"><a class="brand" href="./"><span class="brand-mark">A</span><span>Akarsh ModStore</span></a><div class="topbar-actions"><a class="refresh-link" href="./" aria-label="Refresh store" title="Refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7v5h-5"/><path d="M4 17v-5h5"/><path d="M5.6 9A7 7 0 0 1 17.3 6.3L20 12"/><path d="M4 12l2.7 5.7A7 7 0 0 0 18.4 15"/></svg></a><a class="admin-link" href="admin.html">Admin</a></div></header><main class="wrap"><section class="intro"><p class="eyebrow">YOUR CIRCLE, YOUR APPS</p><h1>Akarsh ki dukaan, lelo apna samaan</h1><p>Mods, gathered in one place.</p></section><label class="search"><span>⌕</span><input id="search" placeholder="Search apps and mods"></label><div id="status" class="status">Connecting to catalogue…</div><nav id="categories" class="chips"></nav><section><div class="section-head"><h2 id="sectionTitle">All Apps</h2><span id="count"></span></div><div id="apps" class="grid"></div></section></main><footer>Akarsh Ki Dukaan · Download only files you trust.</footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="store.js"></script></body></html>
