<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#09090d">
  <meta name="description" content="Akarsh Ki Dukaan — a curated app catalogue for your circle.">
  <title>Akarsh Ki Dukaan</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="Akarsh Ki Dukaan home">
        <span class="brand-mark">A</span>
        <span class="brand-name">Akarsh <span>Ki Dukaan</span></span>
      </a>
      <button class="icon-button profile-button" id="libraryShortcut" aria-label="Open library" title="Library">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M4 5.5v16M8 7h8M8 11h7"/></svg>
      </button>
    </header>

    <main>
      <section class="intro-section">
        <p class="eyebrow"><span class="eyebrow-dot"></span> YOUR CIRCLE, YOUR APPS</p>
        <h1>Discover<span class="accent-period">.</span></h1>
        <p class="intro-copy">Good apps, gathered in one place.</p>
      </section>

      <label class="search-box" for="searchInput">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5"/></svg>
        <input id="searchInput" type="search" placeholder="Search apps and games" autocomplete="off">
        <kbd>/</kbd>
      </label>

      <nav class="categories" id="categoryBar" aria-label="App categories"></nav>

      <section class="featured-section" id="featuredSection">
        <div class="section-heading">
          <div>
            <p class="eyebrow">HANDPICKED</p>
            <h2>Featured</h2>
          </div>
          <span class="section-spark" aria-hidden="true">✳</span>
        </div>
        <div id="featuredCard"></div>
      </section>

      <section class="catalog-section">
        <div class="section-heading catalog-heading">
          <div>
            <p class="eyebrow">THE COLLECTION</p>
            <h2 id="catalogTitle">Recently added</h2>
          </div>
          <span class="result-count" id="resultCount"></span>
        </div>
        <div class="app-grid" id="appGrid"></div>
        <div class="empty-state hidden" id="emptyState">
          <div class="empty-symbol">⌕</div>
          <h3>No apps found</h3>
          <p>Try another search or category.</p>
          <button class="text-button" id="clearFilters">Clear filters</button>
        </div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="Main navigation">
      <button class="nav-item active" data-view="discover" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7h-6v7H4a1 1 0 0 1-1-1z"/></svg>
        <span>Discover</span>
      </button>
      <button class="nav-item" data-view="categories">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>
        <span>Categories</span>
      </button>
      <button class="nav-item" data-view="updates">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.6 9A7 7 0 0 1 18 6.5L20 12M4 12l2 5.5A7 7 0 0 0 18.4 15"/></svg>
        <span>Updates</span>
      </button>
      <button class="nav-item" data-view="library">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14a2 2 0 0 1 2 2v14H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/><path d="M7 8h10M7 12h7M3 18h18"/></svg>
        <span>Library</span>
      </button>
    </nav>
  </div>

  <div class="modal-overlay" id="modalOverlay" aria-hidden="true">
    <section class="detail-sheet" role="dialog" aria-modal="true" aria-labelledby="modalName">
      <button class="icon-button close-button" id="closeModal" aria-label="Close details">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
      </button>
      <div class="detail-top">
        <div id="modalIcon" class="app-icon detail-icon"></div>
        <div class="detail-title-wrap">
          <p class="eyebrow" id="modalCategory"></p>
          <h2 id="modalName"></h2>
          <p id="modalShortDesc" class="detail-short"></p>
        </div>
      </div>
      <div class="detail-stats">
        <div><span>VERSION</span><strong id="modalVersion"></strong></div>
        <div><span>SIZE</span><strong id="modalSize"></strong></div>
        <div><span>TYPE</span><strong id="modalType">APK</strong></div>
      </div>
      <div class="detail-description">
        <h3>About this app</h3>
        <p id="modalDesc"></p>
      </div>
      <div class="detail-actions">
        <a id="modalDownload" class="primary-button" href="#" target="_blank" rel="noopener noreferrer">Download</a>
        <p id="downloadNote" class="download-note">Only install APKs from sources you trust.</p>
      </div>
    </section>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="script.js"></script>
</body>
</html>
